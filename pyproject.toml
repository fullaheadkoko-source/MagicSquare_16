[project]
name = "magicsquare-16"
version = "0.1.0"
description = "4×4 magic square completion (TDD practice)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["magicsquare*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
